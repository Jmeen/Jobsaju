<link rel="stylesheet" href="../styles.css">
<div style="display:grid;grid-template-columns:repeat(5,1fr);height:100%;font-family:var(--font-body);font-size:11px;color:var(--color-ink)">
<div style="background:var(--color-element-wood-soft);display:flex;flex-direction:column;justify-content:space-between;padding:8px"><b>목 wood</b><div style="width:28px;height:28px;border-radius:50%;background:var(--color-element-wood-accent)"></div>#7fae9a</div>
<div style="background:var(--color-element-fire-soft);display:flex;flex-direction:column;justify-content:space-between;padding:8px"><b>화 fire</b><div style="width:28px;height:28px;border-radius:50%;background:var(--color-element-fire-accent)"></div>#e99a88</div>

<div style="background:var(--color-element-metal-soft);display:flex;flex-direction:column;justify-content:space-between;padding:8px"><b>금 metal</b><div style="width:28px;height:28px;border-radius:50%;background:var(--color-element-metal-accent)"></div>#c7b27a</div>
<div style="background:var(--color-element-water-soft);display:flex;flex-direction:column;justify-content:space-between;padding:8px"><b>수 water</b><div style="width:28px;height:28px;border-radius:50%;background:var(--color-element-water-accent)"></div>#7893ae</div>
</div>
