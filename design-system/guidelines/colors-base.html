<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:100%;font-family:var(--font-body);font-size:11px;color:var(--color-ink)">
<div style="flex:1;background:var(--color-page);display:flex;align-items:flex-end;padding:8px">page #faf8f2</div>
<div style="flex:1;background:var(--color-card);display:flex;align-items:flex-end;padding:8px">card #f3f0e7</div>
<div style="flex:1;background:var(--color-card-strong);display:flex;align-items:flex-end;padding:8px">card-strong #ede8da</div>
<div style="flex:1;background:var(--color-brand);color:#faf8f2;display:flex;align-items:flex-end;padding:8px">brand #66866e</div>
<div style="flex:1;background:var(--color-brand-soft);display:flex;align-items:flex-end;padding:8px">brand-soft #e8eee8</div>
<div style="flex:1;background:var(--color-ink);color:#faf8f2;display:flex;align-items:flex-end;padding:8px">ink #2f3732</div>
<div style="flex:1;background:var(--color-muted);color:#fff;display:flex;align-items:flex-end;padding:8px">muted #858b83</div>
<div style="flex:1;background:var(--color-line);display:flex;align-items:flex-end;padding:8px">line #ddd8cd</div>
</div>
