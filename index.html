<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>60마리 중 내 수호신은 누구?</title>

    <!-- OpenGraph (카카오톡, 페이스북, 인스타그램 링크 공유 썸네일) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="직장인마다 하나씩 있다는 60마리 중 내 수호신은 누구?" />
    <meta property="og:description" content="태어난 날의 기운으로 만나는 나랑 꼭 닮은 직장생활 수호신" />
    <meta property="og:image" content="https://jobsaju.kr/og-guardian-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://jobsaju.kr/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="직장인마다 하나씩 있다는 60마리 중 내 수호신은 누구?" />
    <meta name="twitter:description" content="태어난 날의 기운으로 만나는 나랑 꼭 닮은 직장생활 수호신" />
    <meta name="twitter:image" content="https://jobsaju.kr/og-guardian-share.png" />

    <!--
      결제(포트원)·공유(카카오) SDK는 여기서 동기로 받지 않는다.
      <head>의 동기 <script>는 첫 렌더를 막는데, 두 SDK 모두 결과 화면 이후에나 쓰인다.
      - 포트원: 결제 클릭 시점에 로드 (src/utils/portone.ts)
      - 카카오: 결과 화면 진입 시 미리 로드 (src/utils/kakaoSdk.ts)
      두 CDN에 미리 연결만 열어두어 실제 로드 시 핸드셰이크 비용을 없앤다.
    -->
    <link rel="preconnect" href="https://cdn.portone.io" crossorigin />
    <link rel="preconnect" href="https://t1.kakaocdn.net" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
